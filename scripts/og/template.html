<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
@font-face {
  font-family: "Noto Sans JP";
  src: url("{{FONT_URL}}");
  font-weight: 100 900;
}

* {
  box-sizing: border-box;
}

body {
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  margin: 0;
  padding: 72px 80px 56px;
  background: #ffffff;
  color: #000000;
  font-family: "Noto Sans JP", sans-serif;
}

.title-area {
  display: flex;
  flex: 1;
  align-items: center;
  min-height: 0;
  padding-bottom: 24px;
}

.title {
  margin: 0;
  font-size: 88px;
  font-weight: 700;
  line-height: 1.35;
  overflow-wrap: anywhere;
  word-break: auto-phrase;
  text-wrap: balance;
}

.author {
  display: flex;
  align-items: center;
  gap: 24px;
  padding-top: 32px;
  border-top: 1px solid #000000;
}

.author img {
  width: 72px;
  height: 72px;
  object-fit: cover;
  border-radius: 8px;
}

.author span {
  font-size: 36px;
  font-weight: 700;
}
</style>
</head>
<body>
<div class="title-area" id="title-area">
<h1 class="title" id="title">{{TITLE}}</h1>
</div>
<div class="author">
<img src="{{AVATAR_URL}}" alt="">
<span>Yuma Satake Blog</span>
</div>
<script type="module">
const MIN_FONT_SIZE = 32;
const FONT_SIZE_STEP = 2;

const area = document.getElementById("title-area");
const title = document.getElementById("title");

/**
 * タイトルが領域に収まるまでフォントサイズを縮める
 * @param {number} size
 * @returns {void}
 */
const shrinkToFit = (size) => {
  if (title.offsetHeight <= area.clientHeight || size <= MIN_FONT_SIZE) return;
  const nextSize = size - FONT_SIZE_STEP;
  title.style.fontSize = `${nextSize}px`;
  shrinkToFit(nextSize);
};

/**
 * フォントを読み込み、タイトルを領域に収めて描画完了を通知する
 * @returns {Promise<void>}
 */
const fitTitle = async () => {
  const loadedFonts = await document.fonts.load('700 1em "Noto Sans JP"');
  if (loadedFonts.length === 0) throw new Error("Font failed to load");
  shrinkToFit(parseInt(getComputedStyle(title).fontSize, 10));
  if (title.offsetHeight > area.clientHeight) throw new Error("Title does not fit");
  document.body.dataset.ready = "true";
};

try {
  await fitTitle();
} catch (error) {
  document.body.dataset.error = error instanceof Error ? error.message : "Unknown error";
}
</script>
</body>
</html>
